---
# Fork-only: builds the unsigned Windows MSI for this branch through the
# project's own Windows pipeline, without release, signing or symbol publishing.
name: Fork build (Windows)
permissions: {}

on:
  push:
    branches:
      - trigger-status
  workflow_dispatch:

jobs:
  library-tests:
    name: libvirtualgamepad tests
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
          submodules: false
      - name: Checkout libvirtualgamepad submodule
        run: git submodule update --init --depth 1 third-party/libvirtualgamepad
      - name: Build and run controller tests
        shell: pwsh
        working-directory: third-party/libvirtualgamepad
        run: |
          cmake -S driver/tests -B build/contract-tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build/contract-tests --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build/contract-tests -C Release --output-on-failure

  build-windows:
    name: Windows
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/ci-windows.yml
    with:
      build_only: true
      build_tests: false
      release_commit: ${{ github.sha }}
      release_version: 2.0.1
      release_artifact_retention_days: 7
      symbol_product_name: Vibepollo
      symbol_release_prefix: polo
